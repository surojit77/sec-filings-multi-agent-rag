[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secrag"
version = "0.1.0"
description = "Multi-agent, citation-grounded RAG over SEC 10-K/10-Q filings (LangGraph + hybrid retrieval + XBRL-checked verification)"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2",
  "openai>=1.40",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
secrag = "secrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
